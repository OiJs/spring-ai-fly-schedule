<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fly Schedule AI - LLM 지능형 검색</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f0f2f5; height: 100vh; display: flex; flex-direction: column; }
        .chat-container { flex: 1; overflow-y: auto; padding: 20px; background: white; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .message { margin-bottom: 20px; max-width: 80%; padding: 12px 16px; border-radius: 15px; position: relative; white-space: pre-wrap; }
        .user-message { background-color: #007bff; color: white; align-self: flex-end; margin-left: auto; border-bottom-right-radius: 2px; }
        .ai-message { background-color: #e9ecef; color: #212529; align-self: flex-start; border-bottom-left-radius: 2px; }
        .chat-input-area { background: white; padding: 20px; border-top: 1px solid #dee2e6; }
        .example-prompt { cursor: pointer; transition: background 0.2s; }
        .example-prompt:hover { background-color: #e2e6ea; }
        pre { white-space: pre-wrap; font-size: 0.9rem; margin-top: 10px; background: rgba(0,0,0,0.05); padding: 10px; border-radius: 5px; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">Fly Schedule AI</a>
        <div class="navbar-nav">
            <a class="nav-link" href="/">홈</a>
            <a class="nav-link" href="/search">통합 검색</a>
            <a class="nav-link active" href="/llm">LLM 검색</a>
        </div>
    </div>
</nav>

<div class="container my-4 d-flex flex-column flex-grow-1">
    <div class="row flex-grow-1">
        <!-- Sidebar: Examples & Models -->
        <div class="col-md-3 mb-4">
            <div class="card shadow-sm mb-3">
                <div class="card-header bg-primary text-white">모델 선택</div>
                <div class="card-body">
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="llmModel" id="modelGemini" value="gemini" checked>
                        <label class="form-check-label" for="modelGemini">Google Gemini</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="llmModel" id="modelOllama" value="ollama">
                        <label class="form-check-label" for="modelOllama">Ollama (Local)</label>
                    </div>
                </div>
            </div>

            <div class="card shadow-sm">
                <div class="card-header bg-info text-white">이런 질문을 해보세요!</div>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item example-prompt" onclick="setPrompt(this.innerText)">내일 김포에서 제주 가는 비행기 알려줘</li>
                    <li class="list-group-item example-prompt" onclick="setPrompt(this.innerText)">다음 주 화요일 부산에서 서울 가는 대한항공 찾아줘</li>
                    <li class="list-group-item example-prompt" onclick="setPrompt(this.innerText)">제주에서 김포 가는 것 중 5만원 이하로 추천해줘</li>
                    <li class="list-group-item example-prompt" onclick="setPrompt(this.innerText)">모레 아침 10시 이후에 출발하는 광주행 비행기 있어?</li>
                </ul>
            </div>
        </div>

        <!-- Main: Chat Area -->
        <div class="col-md-9 d-flex flex-column">
            <div id="chatWindow" class="chat-container d-flex flex-column">
                <div class="message ai-message">
                    안녕하세요! 무엇을 도와드릴까요? 항공편 검색, 공항 정보 등 궁금한 점을 자연스럽게 물어보세요.
                </div>
            </div>

            <div class="chat-input-area mt-3 shadow-sm rounded">
                <form id="chatForm" class="d-flex gap-2">
                    <input type="text" id="userInput" class="form-control" placeholder="메시지를 입력하세요..." required autocomplete="off">
                    <button type="submit" class="btn btn-primary px-4">전송</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    const chatWindow = document.getElementById('chatWindow');
    const chatForm = document.getElementById('chatForm');
    const userInput = document.getElementById('userInput');

    function setPrompt(text) {
        userInput.value = text;
        userInput.focus();
    }

    function appendMessage(role, text, data = null) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${role === 'user' ? 'user-message' : 'ai-message'}`;
        
        let content = `<div>${text}</div>`;
        
        // 데이터(항공편 리스트 등)가 있는 경우 추가 렌더링
        if (data && data.airlineGroups && data.airlineGroups.length > 0) {
            let dataHtml = '<div class="mt-3">';
            data.airlineGroups.forEach(group => {
                dataHtml += `
                    <div class="card mb-3 border-0 shadow-sm text-dark" style="font-size: 0.9rem;">
                        <div class="card-header py-2 bg-light border-bottom-0">
                            <strong>${group.airlineName}</strong>
                        </div>
                        <div class="card-body p-0">
                            <ul class="list-group list-group-flush">
                `;
                group.flights.forEach(f => {
                    const dep = f.depPlandTime || f.departureTime || '';
                    const arr = f.arrPlandTime || f.arrivalTime || '';
                    const price = (f.economyCharge || 0).toLocaleString();
                    
                    const formatTime = (t) => t.length >= 12 ? t.substring(8, 10) + ':' + t.substring(10, 12) : t;
                    const formattedDep = formatTime(dep);
                    const formattedArr = formatTime(arr);

                    dataHtml += `
                                <li class="list-group-item py-2 d-flex justify-content-between align-items-center">
                                    <div>
                                        <span class="badge bg-secondary me-2">${f.vihicleId || f.flightId}</span>
                                        <span class="text-muted">${formattedDep} &rarr; ${formattedArr}</span>
                                    </div>
                                    <span class="text-primary fw-bold">${price}원</span>
                                </li>
                    `;
                });
                dataHtml += `
                            </ul>
                        </div>
                    </div>
                `;
            });
            dataHtml += '</div>';
            content += dataHtml;
        }

        msgDiv.innerHTML = content;
        chatWindow.appendChild(msgDiv);
        chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    chatForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const text = userInput.value.trim();
        if (!text) return;

        const selectedModel = document.querySelector('input[name="llmModel"]:checked').value;

        appendMessage('user', text);
        userInput.value = '';

        // 로딩 표시용 AI 메시지
        const loadingDiv = document.createElement('div');
        loadingDiv.className = 'message ai-message text-muted';
        loadingDiv.innerText = '생각 중...';
        chatWindow.appendChild(loadingDiv);
        chatWindow.scrollTop = chatWindow.scrollHeight;

        try {
            const response = await fetch(`/api/chat/${selectedModel}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text })
            });
            const result = await response.json();
            
            chatWindow.removeChild(loadingDiv);
            appendMessage('ai', result.message, result.data);
        } catch (error) {
            chatWindow.removeChild(loadingDiv);
            appendMessage('ai', `오류가 발생했습니다: ${error.message}`);
        }
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
